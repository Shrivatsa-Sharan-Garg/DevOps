name: Sync Branches & Directories

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: sync-branches-workspace
  cancel-in-progress: false

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config --global user.name "DevBridge Sync Bot"
          git config --global user.email "bot@devbridge.local"

      - name: Run Fork Sync Script (If Fork)
        run: |
          chmod +x scripts/sync-fork.sh
          ./scripts/sync-fork.sh

      - name: Run sync script from temporary directory
        env:
          SRC_REF: origin/main
          SYNC_DIR: ml
          TARGETS: "web-dev mob-dev mob-dev2"
          BRIDGE_FROM: "mob-dev"
          BRIDGE_TO: "mob-dev2"
          BRIDGE_DIR: "DevBridge"
        run: |
          cp scripts/sync.sh "$RUNNER_TEMP/sync.sh"
          chmod +x "$RUNNER_TEMP/sync.sh"
          "$RUNNER_TEMP/sync.sh"
